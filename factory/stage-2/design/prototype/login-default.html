<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome back · Pocketful</title><link rel="icon" href="/static/mark.svg"><link rel="stylesheet" href="/static/app.css"></head><body class="auth-body"><main class="auth">
<section class="card auth-card"><img class="brand-logo" src="/static/logo.svg" alt="Pocketful"><div><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Log in to your Pocketful wallet.</p></div>
<form class="form"><div class="field"><label class="label" for="login-email">Email</label><input class="input" id="login-email" data-testid="login-email" value="" placeholder="you@example.com" autocomplete="off"></div><div class="field"><label class="label" for="login-password">Password</label><input class="input" id="login-password" data-testid="login-password" value="" placeholder="••••••••" autocomplete="off"></div><div class="form-actions"><button class="btn btn-primary btn-block" data-testid="login-submit">Log in</button></div></form><p class="auth-switch">New to Pocketful? <a href="/signup">Create an account</a></p></section>
<aside class="auth-art"><img src="/static/auth.svg" alt=""><p class="auth-art-title">Money between friends, without the awkward part.</p><p class="auth-art-text">Every payment is confirmed exactly once — even when your connection drops.</p></aside>
</main></body></html>
