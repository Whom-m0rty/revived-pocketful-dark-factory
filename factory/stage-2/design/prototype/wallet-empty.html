<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet · Pocketful</title><link rel="icon" href="/static/mark.svg"><link rel="stylesheet" href="/static/app.css"></head><body>
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="/"><img class="brand-logo" src="/static/logo.svg" alt="Pocketful"></a>
<nav class="nav" aria-label="Main"><a class="nav-link" href="/" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-wallet"/></svg><span>Wallet</span></a><a class="nav-link" href="/requests"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-request"/></svg><span>Requests</span></a><a class="nav-link" href="/split"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-split"/></svg><span>Split</span></a><a class="nav-link" href="/authorizations"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-hold"/></svg><span>Holds</span></a></nav>
<div class="user"><span class="avatar" aria-hidden="true">A</span><span class="user-text"><span class="user-name" data-testid="current-user">Ada Lovelace</span><span class="user-handle">@<span data-testid="current-handle">ada</span></span></span>
<button class="btn btn-quiet btn-icon" data-testid="logout-button" aria-label="Log out"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-logout"/></svg><span class="btn-label">Log out</span></button></div>
</div></header>
<main class="page">
<div class="page-header"><div><h1 class="page-title">Wallet</h1><p class="page-sub">Good afternoon, Ada.</p></div></div>
<section class="card balance"><div class="balance-main"><span class="stat-label">Available to spend</span>
<span class="stat-hero num" data-testid="wallet-available" data-amount="10000">100.00 EUR</span></div>
<dl class="balance-meta"><div class="stat"><dt class="stat-label">Total balance</dt><dd class="stat-value num" data-testid="wallet-balance" data-amount="10000">100.00 EUR</dd></div></dl>
<button class="btn btn-quiet btn-sm btn-icon balance-refresh" data-testid="wallet-refresh"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-refresh"/></svg><span>Refresh</span></button></section><div class="grid-wallet"><div class="stack"><section class="card"><div class="card-header"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-send"/></svg><h2 class="card-title">Send money</h2></div></div>
<form class="form"><div class="field"><label class="label" for="pay-handle">To</label><div class="input-affix"><span class="affix">@</span><input class="input" id="pay-handle" data-testid="pay-handle" value="" placeholder="handle" autocomplete="off"></div></div>
<div class="field-row"><div class="field"><label class="label" for="pay-amount">Amount</label><div class="input-affix"><input class="input input-amount num" id="pay-amount" data-testid="pay-amount" value="" placeholder="0.00" autocomplete="off" inputmode="decimal"><span class="affix">EUR</span></div></div><div class="field"><label class="label" for="pay-visibility">Who can see it</label><select class="select" id="pay-visibility" data-testid="pay-visibility"><option value="private" selected>Private</option><option value="public">Public</option></select></div></div>
<div class="field"><label class="label" for="pay-note">Note <span class="label-opt">(optional)</span></label><input class="input" id="pay-note" data-testid="pay-note" value="" placeholder="What’s it for?" autocomplete="off"></div>
<div class="form-actions"><button class="btn btn-primary btn-block" data-testid="pay-submit">Send money</button></div></form></section><section class="card"><div class="card-header"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-request"/></svg><h2 class="card-title">Request money</h2></div></div>
<form class="form"><div class="field"><label class="label" for="request-handle">From</label><div class="input-affix"><span class="affix">@</span><input class="input" id="request-handle" data-testid="request-handle" value="" placeholder="handle" autocomplete="off"></div></div>
<div class="field"><label class="label" for="request-amount">Amount</label><div class="input-affix"><input class="input input-amount num" id="request-amount" data-testid="request-amount" value="" placeholder="0.00" autocomplete="off" inputmode="decimal"><span class="affix">EUR</span></div></div>
<div class="field"><label class="label" for="request-note">Note <span class="label-opt">(optional)</span></label><input class="input" id="request-note" data-testid="request-note" value="" placeholder="Concert tickets" autocomplete="off"></div>
<div class="form-actions"><button class="btn btn-secondary btn-block" data-testid="request-submit">Send request</button></div></form></section></div><section class="card"><div class="card-header"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-clock"/></svg><h2 class="card-title">Activity</h2></div><span class="card-sub">Newest first</span></div>
<div class="card-body"><div class="empty" data-testid="empty-activity"><img class="empty-art" src="/static/empty-activity.svg" alt=""><p class="empty-title">No activity yet</p><p class="empty-text">Payments you send or receive, and public payments between others, show up here.</p></div></div></section></div>
</main></body></html>
